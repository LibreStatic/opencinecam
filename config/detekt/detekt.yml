#
# Applied on top of detekt's default configuration (--build-upon-default-config).
# detekt watches size, complexity and likely bugs; formatting is ktlint's job (.editorconfig).
# Findings that predate detekt are listed in baseline.xml; new code must not add any.
# Refresh the baseline only after removing findings: ./gradlew detektBaseline

complexity:
  # Composables legitimately take a parameter per state and callback.
  LongParameterList:
    ignoreAnnotated: ['Composable']

exceptions:
  # Camera2 and MediaCodec failures surface as several unrelated exception types; catching
  # Exception at a hardware boundary is deliberate here.
  TooGenericExceptionCaught:
    active: false

style:
  # ktlint no longer checks imports; detekt does.
  UnusedImports:
    active: true
  # Camera, colour and codec code is full of physical constants used once at their call site.
  MagicNumber:
    active: false
  # The project's layout uses long lines; ktlint owns layout.
  MaxLineLength:
    active: false
  WildcardImport:
    active: false
  ReturnCount:
    active: false

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    active: false
  MatchingDeclarationName:
    active: false
