# Every push to main builds a GitHub prerelease tagged v<versionName>+<versionCode>, where
# versionCode = GITHUB_RUN_NUMBER + 100 (see app/build.gradle.kts). It carries the Play App Bundle
# signed with the upload key and the ARM64 APK signed with the GitHub/F-Droid release key.
# Uploading the bundle to Google Play stays manual.

name: Play prerelease

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: play-prerelease-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prerelease:
    name: Signed AAB and APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          name="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -1)"
          code=$((GITHUB_RUN_NUMBER + 100))
          tag="v${name}+${code}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Reconstruct keystores
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.OPENCINECAM_UPLOAD_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RELEASE_KEYSTORE_BASE64" || { echo "::error::ANDROID_RELEASE_KEYSTORE_BASE64 is missing"; exit 1; }
          test -n "$UPLOAD_KEYSTORE_BASE64" || { echo "::error::OPENCINECAM_UPLOAD_KEYSTORE_BASE64 is missing"; exit 1; }
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/opencinecam-release.jks"
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/opencinecam-upload.jks"
          chmod 600 "$RUNNER_TEMP"/*.jks
          echo "ANDROID_RELEASE_KEYSTORE=$RUNNER_TEMP/opencinecam-release.jks" >> "$GITHUB_ENV"
          echo "OPENCINECAM_UPLOAD_KEYSTORE=$RUNNER_TEMP/opencinecam-upload.jks" >> "$GITHUB_ENV"
      - name: Test, lint and build the signed APK
        env:
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          ./tools/check_format.sh
          RELEASE_OUTPUT_DIR=build/release ./tools/build-verified-release.sh
      - name: Build the signed Play bundle
        env:
          OPENCINECAM_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.OPENCINECAM_UPLOAD_KEYSTORE_PASSWORD }}
          OPENCINECAM_UPLOAD_KEY_ALIAS: ${{ secrets.OPENCINECAM_UPLOAD_KEY_ALIAS }}
          OPENCINECAM_UPLOAD_KEY_PASSWORD: ${{ secrets.OPENCINECAM_UPLOAD_KEY_PASSWORD }}
        shell: bash
        run: RELEASE_OUTPUT_DIR=build/release ./tools/build-play-bundle.sh
      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          base="OpenCineCam-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}"
          mkdir -p dist
          cp "build/release/OpenCineCam-${{ steps.version.outputs.name }}-arm64-release.apk" "dist/$base-arm64.apk"
          cp "build/release/$base-play.aab" "dist/$base-play.aab"
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: OpenCineCam-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}
          path: dist/
      - name: Publish GitHub prerelease
        if: steps.version.outputs.exists == 'false' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${{ steps.version.outputs.tag }}" dist/* \
            --target "$GITHUB_SHA" \
            --title "OpenCineCam ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})" \
            --generate-notes \
            --prerelease
