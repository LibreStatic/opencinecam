name: Android quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: JDK 17 lint, tests, and ARM64 debug build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run deterministic formatting checks
        run: ./tools/check_format.sh
      - name: Run lint, unit tests, and ARM64 debug build
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --dependency-verification=strict --console=plain lint test assembleDebug --stacktrace 2>&1 | tee build/ci-gradle.log
      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-quality-reports
          path: |
            build/ci-gradle.log
            app/build/reports/
            app/build/test-results/
            camera/build/reports/
            camera/build/test-results/
            media/build/reports/
            media/build/test-results/
          if-no-files-found: warn
          retention-days: 7
