name: Android quality

# Instrumented tests (app/src/androidTest, ~832 methods) are local-only: they need a camera
# emulator or physical device and are not run by any workflow. See docs/testing-strategy.md.
on:
  push:
    branches: [main, 'wip/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tools:
    name: Python tooling tests and plan graph
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Run tools/tests
        run: python3 -m unittest discover -s tools/tests -p 'test_*.py' -v
      - name: Validate plan graph
        # evidence/ is gitignored, so missing Done-plan evidence is reported as a warning here;
        # release certification runs the validator with --require-evidence.
        run: python3 tools/validate_plan_system.py

  quality:
    name: JDK 17 lint, static analysis, tests with coverage, and ARM64 debug build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Run deterministic formatting checks
        run: ./tools/check_format.sh
      - name: Run ktlint and detekt
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          ./gradlew --no-daemon --dependency-verification=strict --console=plain staticAnalysis --stacktrace 2>&1 | tee build/ci-static-analysis.log
      - name: Run lint, unit tests with coverage, and ARM64 debug build
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          ./gradlew --no-daemon --dependency-verification=strict --console=plain lint test koverXmlReportUnit koverHtmlReportUnit assembleDebug --stacktrace 2>&1 | tee build/ci-gradle.log
      - name: Summarize coverage
        if: success()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          root = ET.parse("build/reports/kover/reportUnit.xml").getroot()
          print("### Unit test coverage (debug, JVM tests)\n\n| Counter | Covered |\n|---|---|")
          for c in root.findall("counter"):
              missed, covered = int(c.get("missed")), int(c.get("covered"))
              print(f"| {c.get('type').title()} | {100 * covered / (missed + covered):.1f}% ({covered}/{missed + covered}) |")
          PY
      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-quality-reports
          path: |
            build/ci-gradle.log
            build/ci-static-analysis.log
            build/reports/ktlint/
            build/reports/detekt/
            build/reports/kover/
            app/build/reports/
            app/build/test-results/
            camera/build/reports/
            camera/build/test-results/
            media/build/reports/
            media/build/test-results/
            core/model/build/reports/
            core/model/build/test-results/
          if-no-files-found: warn
          retention-days: 7
