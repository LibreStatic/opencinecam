name: Android quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: JDK 17 lint, unit tests, and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run deterministic formatting checks
        run: ./tools/check_format.sh
      - name: Run lint, unit tests, and assemble
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --dependency-verification=strict --console=plain lint test assembleDebug --stacktrace 2>&1 | tee build/ci-gradle.log
      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-quality-reports
          path: |
            build/ci-gradle.log
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn

  instrumentation:
    name: Emulator instrumentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run connected Android tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: ./gradlew --no-daemon --dependency-verification=strict --console=plain connectedDebugAndroidTest --stacktrace
      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumentation-reports
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
