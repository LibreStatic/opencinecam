name: Android tagged release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Signed ARM64 APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Validate tag and Android version
        shell: bash
        run: |
          set -euo pipefail
          version_name="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -1)"
          test -n "$version_name"
          test "${GITHUB_REF_NAME#v}" = "$version_name" || {
            echo "Tag $GITHUB_REF_NAME does not match Android versionName $version_name." >&2
            exit 1
          }
          echo "APP_VERSION=$version_name" >> "$GITHUB_ENV"
      - name: Reconstruct release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/opencinecam-release.jks"
          chmod 600 "$RUNNER_TEMP/opencinecam-release.jks"
          echo "ANDROID_RELEASE_KEYSTORE=$RUNNER_TEMP/opencinecam-release.jks" >> "$GITHUB_ENV"
      - name: Build and verify signed APKs
        env:
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          ./tools/check_format.sh
          ./gradlew --no-daemon --dependency-verification=strict --console=plain :app:assembleDebug
          RELEASE_OUTPUT_DIR=build/release ./tools/build-verified-release.sh

          cp app/build/outputs/apk/debug/app-debug.apk "build/release/OpenCineCam-$APP_VERSION-arm64-debug.apk"
          build_tools="$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$build_tools/apksigner" verify --verbose "build/release/OpenCineCam-$APP_VERSION-arm64-debug.apk"

          for apk in build/release/OpenCineCam-"$APP_VERSION"-arm64-{debug,release}.apk; do
            mapfile -t abis < <(zipinfo -1 "$apk" | awk -F/ '$1 == "lib" {print $2}' | sort -u)
            [[ "${#abis[@]}" -eq 1 && "${abis[0]}" == "arm64-v8a" ]] || {
              echo "Unexpected ABIs in $apk: ${abis[*]:-none}" >&2
              exit 1
            }
          done

          cd build/release
          sha256sum \
            "OpenCineCam-$APP_VERSION-arm64-debug.apk" \
            "OpenCineCam-$APP_VERSION-arm64-release.apk" > SHA256SUMS
          rm -f "OpenCineCam-$APP_VERSION-arm64-aligned.apk" \
            "OpenCineCam-$APP_VERSION-arm64-release.apk.sha256"
      - name: Create GitHub Release and upload APKs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            "build/release/OpenCineCam-$APP_VERSION-arm64-debug.apk"
            "build/release/OpenCineCam-$APP_VERSION-arm64-release.apk"
            "build/release/SHA256SUMS"
          )

          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --generate-notes --title "OpenCineCam ${TAG#v}"
          fi

          for attempt in 1 2 3; do
            error_file="$RUNNER_TEMP/release-upload-$attempt.log"
            if gh release upload "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber 2>"$error_file"; then
              exit 0
            fi
            cat "$error_file" >&2
            if [[ "$attempt" -ge 3 ]] || ! grep -Eiq \
              '(quota|storage|insufficient.*space|exceed(ed|s)?.*(limit|quota)|no space left)' "$error_file"; then
              exit 1
            fi

            oldest="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" | \
              jq -r --arg tag "$TAG" \
              '[.[][] | select(.draft == false and .tag_name != $tag and .published_at != null)]
               | sort_by(.published_at) | first | if . == null then empty else "\(.id)\t\(.tag_name)" end')"
            [[ -n "$oldest" ]] || {
              echo "No older published release is available for quota cleanup." >&2
              exit 1
            }
            release_id="${oldest%%$'\t'*}"
            release_tag="${oldest#*$'\t'}"
            echo "Deleting oldest published release $release_tag; its Git tag is retained." >&2
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$release_id"
          done
