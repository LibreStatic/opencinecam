<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OpenCineCam promo</title>
  <style>
    html, body { margin: 0; background: #F5F3EE; }
    canvas { display: block; }
    body.dev canvas { max-width: 100vw; max-height: calc(100vh - 56px); margin: 0 auto; }
    #dev { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 12px; align-items: center;
      padding: 10px 16px; background: #101417; color: #fff; font: 14px system-ui; }
    #dev input { flex: 1; }
    #dev[hidden] { display: none; }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>
  <div id="dev" hidden><button>Play / pause</button><input type="range" min="0" step="0.01"><span></span></div>
  <script>if (location.search.includes("dev")) document.body.classList.add("dev");</script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
